[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fasttrack-gaming-shorts"
version = "0.1.0"
description = "A template-driven gaming shorts editor using PySide6 and FFmpeg"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "Pillow>=10.0",
]

[tool.setuptools]
packages = ["fasttrack"]
